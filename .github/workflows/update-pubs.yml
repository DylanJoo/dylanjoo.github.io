name: Update publications from BibTeX

on:
  push:
    branches: [main]
    paths:
      - '_data/publications.bib'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install "bibtexparser<2" pyyaml

      - run: python scripts/bib2yaml.py

      - name: Commit if changed, then rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          if git diff --cached --quiet; then
            echo "publications.yml already up to date"
          else
            git commit -m "chore: regenerate publications.yml from publications.bib"
            git push
            # Pushes made with the workflow token don't trigger a Pages build, so request one.
            gh api --method POST "repos/${{ github.repository }}/pages/builds"
          fi
