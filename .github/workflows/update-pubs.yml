name: Update publications from BibTeX

on:
  push:
    branches: [main]
    paths:
      - '_data/publications.bib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install bibtexparser pyyaml

      - run: python scripts/bib2yaml.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: regenerate publications.yml [skip ci]" && git push
